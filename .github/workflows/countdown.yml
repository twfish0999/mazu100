name: Daily Countdown Automation

on:
  schedule:
    - cron: '0 16 * * *' # 台灣時間每天 00:00 自動執行
  workflow_dispatch: # 支援手動觸發

permissions:
  contents: write # 賦予寫入權限以便自動提交圖片

jobs:
  run-countdown:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v3

      - name: 設定 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝相依套件
        run: |
          pip install Pillow pytz

      - name: 執行倒數運算
        run: python main.py

      - name: 提交並推送更新圖片
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output_countdown.jpg
          git commit -m "Auto update countdown image" || exit 0
          git push
