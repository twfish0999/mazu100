from datetime import datetime
import pytz
from PIL import Image, ImageDraw, ImageFont

# 設定目標日期（2027年1月22日）
target_date = datetime(2027, 1, 22, 0, 0, 0)
tz = pytz.timezone("Asia/Taipei")
now = datetime.now(tz)

# 計算剩餘天數
days_left = (target_date.date() - now.date()).days
print(f"目前計算剩餘天數: {days_left}")

# 開啟乾淨底圖
img = Image.open("base.jpg")
draw = ImageDraw.Draw(img)

# 嘗試載入自訂字型，若找不到則自動切換為內建預設字型
try:
  font = ImageFont.truetype("GenWanGothic-M.ttf", 110)
except Exception as e:
  print(f"載入自訂字型失敗，改用預設字型: {e}")
  font = ImageFont.load_default()

text = str(days_left)
img_w, img_h = img.size

# 相容所有 Pillow 版本的文字寬高計算方式
try:
  bbox = draw.textbbox((0, 0), text, font=font)
  text_w = bbox[2] - bbox[0]
  text_h = bbox[3] - bbox[1]
except Exception:
  try:
    text_w, text_h = draw.textsize(text, font=font)
  except Exception:
    text_w, text_h = 80, 100

# 針對紅框位置精準計算（水平置中再往左微調 70 像素，垂直高度 820）
x = (img_w - text_w) / 2 - 70
y = 820

# 繪製白色數字
draw.text((x, y), text, fill=(255, 255, 255), font=font)

# 儲存結果
img.save("output_countdown.jpg")
print("倒數圖片產出成功！")
